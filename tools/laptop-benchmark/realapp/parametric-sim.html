<!doctype html>
<meta charset="utf-8">
<title>Interior configurator load test</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#0f1115;color:#e6edf3;
   font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
 #app{display:flex;height:100%}
 #view{flex:1;position:relative;min-width:0}
 canvas{display:block;width:100%;height:100%}
 #boq{width:290px;background:#161b22;border-left:1px solid #30363d;overflow-y:auto;padding:10px 12px}
 #boq h3{margin:2px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b949e}
 .item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 0;
   border-bottom:1px solid #21262d;font-size:12px}
 .item span:last-child{color:#8b949e;font-variant-numeric:tabular-nums}
 #hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);padding:9px 13px;
   border-radius:7px;white-space:pre;font-variant-numeric:tabular-nums;pointer-events:none;
   font-size:12px;line-height:1.7}
 #done{position:absolute;inset:0;background:#0f1115;overflow-y:auto;padding:34px;display:none}
 #done .in{max-width:820px;margin:0 auto}
 h1{font-size:21px;margin:0 0 6px}
 h2{font-size:15px;margin:26px 0 8px;border-bottom:1px solid #30363d;padding-bottom:5px}
 table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
 th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #30363d}
 th{color:#8b949e;font-weight:600} td{font-variant-numeric:tabular-nums}
 .v{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;color:#fff}
 .f{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #30363d}
 .tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;
   height:fit-content;min-width:46px;text-align:center}
 button{background:#238636;color:#fff;border:0;padding:9px 18px;border-radius:6px;
   font-size:13px;cursor:pointer;margin-right:8px}
 small{color:#8b949e}
</style>
<div id="app">
  <div id="view"><canvas id="c"></canvas><div id="hud">initialising…</div>
    <div id="done"><div class="in"></div></div></div>
  <div id="boq"><h3>Bill of quantities</h3><div id="items"></div></div>
</div>
<script>
"use strict";
/*
 * A standalone stand-in for a browser-based interior-design configurator
 * (Livspace Parametric, Coohom and similar).
 *
 * It reproduces the resource *shape* of that class of application:
 *   - a room shell plus many separately-drawn furniture modules, so draw-call
 *     count is high and poorly batched, which is what these apps actually do
 *   - textured, specular, normal-perturbed surfaces so fragment cost is real
 *   - a continuously orbiting camera
 *   - periodic synchronous "add module" work on the main thread, which is what
 *     produces the stalls users describe as the app hanging
 *   - a live BOQ side panel that re-renders with each change
 *
 * It sweeps four quality levels and reports the highest one the machine holds
 * at 60 and at 30 fps. Everything is measured in this page - nothing is
 * assumed about the hardware.
 */

var LEVELS = [
  { name: "Low",    modules: 8,  panels: 3, tex: 512,  res: 0.75, tess: 8,  ptess: 6,  shell: 24 },
  { name: "Medium", modules: 16, panels: 4, tex: 1024, res: 1.0,  tess: 12, ptess: 10, shell: 40 },
  { name: "High",   modules: 28, panels: 5, tex: 1024, res: 1.0,  tess: 16, ptess: 12, shell: 56 },
  { name: "Ultra",  modules: 44, panels: 6, tex: 2048, res: 1.0,  tess: 24, ptess: 16, shell: 72 },
];
var SECONDS_PER_LEVEL = +(new URLSearchParams(location.search).get("secs") || 20);
var WARMUP_MS = 1500;
var SPIKE_EVERY_MS = 5000;

var canvas = document.getElementById("c"), hud = document.getElementById("hud");
var gl = canvas.getContext("webgl", { antialias: true, powerPreference: "high-performance" });
if (!gl) {
  hud.textContent = "WebGL unavailable - cannot run.";
  throw new Error("no webgl");
}
var uintExt = gl.getExtension("OES_element_index_uint");
var dbg = gl.getExtension("WEBGL_debug_renderer_info");
var RENDERER = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "unknown";
var SOFTWARE = /swiftshader|llvmpipe|software|basic render/i.test(RENDERER);

/* ------------------------------------------------ geometry helpers */
/* Furniture is modelled with real tessellation - rounded-edge panels and
 * turned handles - so the vertex pipeline carries a load comparable to a
 * production configurator, not a placeholder cube. */

function roundedBox(w, h, d, seg, r) {
  var hx = w/2, hy = h/2, hz = d/2;
  r = Math.min(r, Math.min(hx, Math.min(hy, hz)) * 0.9);
  var ix = hx - r, iy = hy - r, iz = hz - r;
  var pos = [], nrm = [], uv = [], idx = [];
  var faces = [
    { ax:[1,0,0],  ay:[0,1,0],  n:[0,0,1]  },
    { ax:[-1,0,0], ay:[0,1,0],  n:[0,0,-1] },
    { ax:[1,0,0],  ay:[0,0,-1], n:[0,1,0]  },
    { ax:[1,0,0],  ay:[0,0,1],  n:[0,-1,0] },
    { ax:[0,0,-1], ay:[0,1,0],  n:[1,0,0]  },
    { ax:[0,0,1],  ay:[0,1,0],  n:[-1,0,0] },
  ];
  function ext(v) { return Math.abs(v[0])*hx + Math.abs(v[1])*hy + Math.abs(v[2])*hz; }

  for (var fi = 0; fi < faces.length; fi++) {
    var f = faces[fi], base = pos.length / 3;
    var ea = ext(f.ax), eb = ext(f.ay), en = ext(f.n);
    for (var j = 0; j <= seg; j++) {
      for (var i = 0; i <= seg; i++) {
        var u = i / seg * 2 - 1, v = j / seg * 2 - 1;
        var px = f.ax[0]*u*ea + f.ay[0]*v*eb + f.n[0]*en;
        var py = f.ax[1]*u*ea + f.ay[1]*v*eb + f.n[1]*en;
        var pz = f.ax[2]*u*ea + f.ay[2]*v*eb + f.n[2]*en;
        // Project onto the rounded shell: clamp into the inner box, then push
        // out by the corner radius along the offset direction.
        var cx = Math.max(-ix, Math.min(ix, px));
        var cy = Math.max(-iy, Math.min(iy, py));
        var cz = Math.max(-iz, Math.min(iz, pz));
        var dx = px - cx, dy = py - cy, dz = pz - cz;
        var L = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
        dx /= L; dy /= L; dz /= L;
        pos.push(cx + dx*r, cy + dy*r, cz + dz*r);
        nrm.push(dx, dy, dz);
        uv.push(i / seg, j / seg);
      }
    }
    var row = seg + 1;
    for (var y = 0; y < seg; y++) {
      for (var x = 0; x < seg; x++) {
        var a = base + y*row + x, b = a + row;
        idx.push(a, b, a+1, a+1, b, b+1);
      }
    }
  }
  return { pos: new Float32Array(pos), nrm: new Float32Array(nrm),
           uv: new Float32Array(uv), idx: new Uint16Array(idx) };
}

function cylinder(r, h, seg) {
  var pos = [], nrm = [], uv = [], idx = [];
  for (var i = 0; i <= seg; i++) {
    var a = i / seg * Math.PI * 2, c = Math.cos(a), s2 = Math.sin(a);
    pos.push(c*r, -h/2, s2*r); nrm.push(c, 0, s2); uv.push(i/seg, 0);
    pos.push(c*r,  h/2, s2*r); nrm.push(c, 0, s2); uv.push(i/seg, 1);
  }
  for (var k = 0; k < seg; k++) {
    var b = k * 2;
    idx.push(b, b+1, b+2, b+2, b+1, b+3);
  }
  // Caps.
  [-1, 1].forEach(function (sign) {
    var centre = pos.length / 3;
    pos.push(0, sign*h/2, 0); nrm.push(0, sign, 0); uv.push(0.5, 0.5);
    for (var i = 0; i <= seg; i++) {
      var a = i / seg * Math.PI * 2;
      pos.push(Math.cos(a)*r, sign*h/2, Math.sin(a)*r);
      nrm.push(0, sign, 0);
      uv.push(0.5 + Math.cos(a)*0.5, 0.5 + Math.sin(a)*0.5);
    }
    for (var i2 = 0; i2 < seg; i2++) {
      if (sign > 0) idx.push(centre, centre+1+i2, centre+2+i2);
      else idx.push(centre, centre+2+i2, centre+1+i2);
    }
  });
  return { pos: new Float32Array(pos), nrm: new Float32Array(nrm),
           uv: new Float32Array(uv), idx: new Uint16Array(idx) };
}

function plane(seg) {
  var pos = [], nrm = [], uv = [], idx = [];
  for (var j = 0; j <= seg; j++) {
    for (var i = 0; i <= seg; i++) {
      pos.push(i/seg - 0.5, 0, j/seg - 0.5);
      nrm.push(0, 1, 0);
      uv.push(i/seg, j/seg);
    }
  }
  var row = seg + 1;
  for (var y = 0; y < seg; y++)
    for (var x = 0; x < seg; x++) {
      var a = y*row + x, b = a + row;
      idx.push(a, b, a+1, a+1, b, b+1);
    }
  return { pos: new Float32Array(pos), nrm: new Float32Array(nrm),
           uv: new Float32Array(uv), idx: new Uint16Array(idx) };
}

function makeBuffers(g) {
  function buf(target, data) {
    var b = gl.createBuffer(); gl.bindBuffer(target, b);
    gl.bufferData(target, data, gl.STATIC_DRAW); return b;
  }
  return {
    pos: buf(gl.ARRAY_BUFFER, g.pos), nrm: buf(gl.ARRAY_BUFFER, g.nrm),
    uv: buf(gl.ARRAY_BUFFER, g.uv), idx: buf(gl.ELEMENT_ARRAY_BUFFER, g.idx),
    count: g.idx.length, tris: g.idx.length / 3,
  };
}

function freeBuffers(m) {
  if (!m) return;
  [m.pos, m.nrm, m.uv, m.idx].forEach(function (b) { gl.deleteBuffer(b); });
}

/* ---------------------------------------------------- procedural textures */
var texCache = {};
function laminate(size, hue) {
  var key = size + "_" + hue;
  if (texCache[key]) return texCache[key];
  var cv = document.createElement("canvas"); cv.width = cv.height = size;
  var x = cv.getContext("2d");
  x.fillStyle = "hsl(" + hue + ",28%,62%)"; x.fillRect(0, 0, size, size);
  // Wood-ish grain: many thin strokes, so the texture is genuinely detailed
  // rather than a flat colour the GPU can trivially cache.
  for (var i = 0; i < size * 1.6; i++) {
    x.strokeStyle = "hsla(" + (hue + (Math.random() * 16 - 8)) + ",30%," +
      (44 + Math.random() * 30) + "%," + (0.05 + Math.random() * 0.22) + ")";
    x.lineWidth = 0.5 + Math.random() * 2.4;
    x.beginPath();
    var y0 = Math.random() * size;
    x.moveTo(0, y0);
    for (var s = 0; s <= size; s += size / 8)
      x.lineTo(s, y0 + Math.sin(s * 0.02 + i) * 5 + (Math.random() * 4 - 2));
    x.stroke();
  }
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  texCache[key] = tex;
  return tex;
}

/* ------------------------------------------------------------- shaders */
var VS = [
"attribute vec3 aPos; attribute vec3 aNrm; attribute vec2 aUv;",
"uniform mat4 uProj, uView, uModel; varying vec3 vN, vP; varying vec2 vUv;",
"void main(){ vec4 w = uModel * vec4(aPos,1.0); vP = w.xyz;",
"  vN = mat3(uModel) * aNrm; vUv = aUv;",
"  gl_Position = uProj * uView * w; }"].join("\n");

var FS = [
"precision highp float;",
"varying vec3 vN, vP; varying vec2 vUv;",
"uniform sampler2D uTex; uniform vec3 uTint, uEye; uniform float uRepeat;",
"void main(){",
"  vec3 base = texture2D(uTex, vUv * uRepeat).rgb * uTint;",
"  // Perturb the normal from the texture so shading cost is realistic.",
"  vec3 t1 = texture2D(uTex, vUv * uRepeat + vec2(0.004,0.0)).rgb;",
"  vec3 t2 = texture2D(uTex, vUv * uRepeat + vec2(0.0,0.004)).rgb;",
"  vec3 N = normalize(vN + vec3((t1.r-base.r)*2.2,(t2.r-base.r)*2.2,0.0));",
"  vec3 V = normalize(uEye - vP);",
"  vec3 col = base * 0.16;",
"  for(int i=0;i<3;i++){",
"    vec3 lp = vec3(float(i)*3.0-3.0, 3.2, 2.0-float(i)*2.0);",
"    vec3 L = normalize(lp - vP);",
"    float d = max(dot(N,L),0.0);",
"    float att = 1.0/(1.0+0.06*dot(lp-vP,lp-vP));",
"    vec3 H = normalize(L+V);",
"    float sp = pow(max(dot(N,H),0.0), 42.0);",
"    col += (base*d + vec3(sp)*0.34) * att * 2.4;",
"  }",
"  float fres = pow(1.0-max(dot(N,V),0.0), 3.5);",
"  col += vec3(0.05,0.07,0.10)*fres;",
"  gl_FragColor = vec4(pow(col, vec3(0.4545)), 1.0);",
"}"].join("\n");

function sh(type, src) {
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
var prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

var A = { pos: gl.getAttribLocation(prog,"aPos"), nrm: gl.getAttribLocation(prog,"aNrm"),
          uv: gl.getAttribLocation(prog,"aUv") };
var U = {}; ["uProj","uView","uModel","uTex","uTint","uEye","uRepeat"].forEach(function(n){
  U[n] = gl.getUniformLocation(prog, n); });

/* ------------------------------------------------------------- matrices */
function perspective(fovy, aspect, near, far){
  var f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function lookAt(eye, ctr){
  var zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
  var zl=Math.hypot(zx,zy,zz)||1; zx/=zl; zy/=zl; zz/=zl;
  var xx=zz*0-0*zy, xy=0*zx-1*zz, xz=1*zy-0*zx; // up = (0,1,0)
  xx =  1*zz - 0*zy; xy = 0*zx - 0*zz; xz = 0*zy - 1*zx;
  var xl=Math.hypot(xx,xy,xz)||1; xx/=xl; xy/=xl; xz/=xl;
  var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]), -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
    -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1]);
}
function model(tx,ty,tz, sx,sy,sz, ry){
  var c=Math.cos(ry), s=Math.sin(ry);
  return new Float32Array([c*sx,0,-s*sx,0, 0,sy,0,0, s*sz,0,c*sz,0, tx,ty,tz,1]);
}

/* ------------------------------------------------------------- the scene */
var MESH = null;       // per-level tessellated meshes
var scene = [];        // {mesh, m: mat4, tint, tex, repeat}
var boqRows = [];

function buildMeshes(level) {
  if (MESH) ["carcass","panel","handle","shell"].forEach(function(k){ freeBuffers(MESH[k]); });
  MESH = {
    carcass: makeBuffers(roundedBox(1, 1, 1, level.tess, 0.045)),
    panel:   makeBuffers(roundedBox(1, 1, 1, level.ptess, 0.06)),
    handle:  makeBuffers(cylinder(0.5, 1, 20)),
    shell:   makeBuffers(plane(level.shell)),
  };
}

function buildScene(level) {
  scene = []; boqRows = [];
  buildMeshes(level);
  var T = level.tex;
  var floorTex = laminate(T, 28), wallTex = laminate(T, 40);
  // Room shell - subdivided planes, so wall and floor shading is interpolated
  // across real geometry rather than two giant triangles.
  scene.push({ mesh: MESH.shell, m: model(0,0,0, 16,1,12, 0),
               tint:[0.85,0.78,0.70], tex:floorTex, repeat:6 });
  scene.push({ mesh: MESH.carcass, m: model(0,2.5,-6, 16,5,0.15, 0),
               tint:[0.93,0.92,0.90], tex:wallTex, repeat:5 });
  scene.push({ mesh: MESH.carcass, m: model(-8,2.5,0, 0.15,5,12, 0),
               tint:[0.93,0.92,0.90], tex:wallTex, repeat:5 });
  scene.push({ mesh: MESH.carcass, m: model(8,2.5,0, 0.15,5,12, 0),
               tint:[0.90,0.89,0.88], tex:wallTex, repeat:5 });

  for (var i = 0; i < level.modules; i++) addModule(i, level, false);
  renderBoq();
}

// One "furniture module" = carcass + door panels + handles, each its own draw
// call. Configurators batch poorly; that is the point of modelling it this way.
function addModule(i, level, isNew) {
  var hue = [26, 34, 200, 12, 48][i % 5];
  var tex = laminate(level.tex, hue);
  var col = Math.floor(i / 3), row = i % 3;
  var bx = -7 + col * 2.1, bz = -5 + row * 3.4;
  var h = 2.0 + (i % 3) * 0.35;
  scene.push({ mesh: MESH.carcass, m: model(bx, h/2, bz, 1.7, h, 0.62, (i%4)*0.08),
               tint: [0.92,0.88,0.84], tex: tex, repeat: 2 });
  for (var p = 0; p < level.panels; p++) {
    var py = 0.22 + p * (h - 0.3) / level.panels;
    scene.push({ mesh: MESH.panel,
                 m: model(bx, py, bz + 0.33, 1.55, (h-0.3)/level.panels - 0.05, 0.05, (i%4)*0.08),
                 tint: [1.0,0.97,0.93], tex: tex, repeat: 1 });
    scene.push({ mesh: MESH.handle, m: model(bx + 0.62, py, bz + 0.40, 0.05, 0.34, 0.05, 0),
                 tint: [0.55,0.57,0.60], tex: tex, repeat: 1 });
  }
  boqRows.push({ name: ["Wardrobe","Base unit","Wall unit","Tall unit","Dresser"][i%5] + " " + (i+1),
                 qty: (1.7 * h).toFixed(2) + " m²" });
}

function renderBoq() {
  // Rebuilding the whole list is deliberately naive - it is what a live BOQ
  // panel costs, and it lands on the main thread with everything else.
  var html = "";
  for (var i = 0; i < boqRows.length; i++)
    html += '<div class="item"><span>' + boqRows[i].name + '</span><span>' + boqRows[i].qty + '</span></div>';
  document.getElementById("items").innerHTML = html;
}

/* ------------------------------------------- measurement (self-contained) */
var M = {
  level: 0, phase: "warmup", results: [],
  frames: 0, times: [], spikes: [], drawCalls: 0, tris: 0,
  levelStart: 0, longTasks: [],
};
try {
  new PerformanceObserver(function (l) {
    l.getEntries().forEach(function (e) { M.longTasks.push(e.duration); });
  }).observe({ entryTypes: ["longtask"] });
  M.longTaskOk = true;
} catch (e) { M.longTaskOk = false; }

function pctl(a, q) {
  if (!a.length) return 0;
  var s = a.slice().sort(function (x,y){return x-y;});
  var i = Math.min(s.length-1, Math.floor(s.length*q/100));
  return s[i];
}

function startLevel(n) {
  M.level = n;
  var lv = LEVELS[n];
  var t0 = performance.now();
  buildScene(lv);
  var buildMs = performance.now() - t0;
  M.phase = "warmup";
  M.frames = 0; M.times = []; M.drawCalls = 0; M.tris = 0;
  M.spikes = []; M.longTasks = [];
  M.buildMs = buildMs;
  M.levelStart = performance.now();
  M.nextSpike = performance.now() + SPIKE_EVERY_MS;
  resize(lv.res);
}

// The "add a wardrobe" moment: synchronous geometry + BOQ work on the main
// thread. This is what makes a configurator feel like it hangs.
function spike() {
  var t0 = performance.now();
  var lv = LEVELS[M.level];
  addModule(boqRows.length, lv, true);
  // Parametric-style constraint solve: real arithmetic the JIT cannot elide.
  // Geometry generation for the new module's parts - real allocation and
  // writes, which the JIT cannot elide the way it elides a pure arithmetic loop.
  var verts = new Float32Array(2400000);
  for (var i = 0; i < verts.length; i += 3) {
    var t = i * 0.0001;
    verts[i]     = Math.sin(t) * 1.7;
    verts[i + 1] = Math.cos(t * 1.3) * 2.1;
    verts[i + 2] = Math.sin(t * 0.7) * 0.62;
  }
  // Constraint relaxation across every module in the room. This is O(n^2), so
  // edits get slower as the design grows - which is how real parametric
  // configurators behave, and why a big project feels worse than a small one.
  var n = boqRows.length;
  var px = new Float64Array(n), py = new Float64Array(n);
  for (var k = 0; k < n; k++) { px[k] = (k % 7) * 1.3; py[k] = (k % 5) * 2.1; }
  for (var it = 0; it < 300; it++) {
    for (var a = 0; a < n; a++) {
      var ax = px[a], ay = py[a];
      for (var b = 0; b < n; b++) {
        if (b === a) continue;
        var dx = ax - px[b], dy = ay - py[b];
        var d2 = dx * dx + dy * dy + 0.01;
        ax += dx / d2 * 0.0007; ay += dy / d2 * 0.0007;
      }
      px[a] = ax; py[a] = ay;
    }
  }
  window.__sink = verts[7] + px[0] + py[0];
  renderBoq();
  var ms = performance.now() - t0;
  M.spikes.push(+ms.toFixed(1));
  return ms;
}

function resize(scale) {
  var dpr = Math.min(window.devicePixelRatio || 1, 2) * scale;
  canvas.width = Math.max(320, Math.floor(canvas.clientWidth * dpr));
  canvas.height = Math.max(240, Math.floor(canvas.clientHeight * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}

gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.06, 0.07, 0.09, 1);

var last = performance.now(), started = performance.now();

function frame(now) {
  var dt = now - last; last = now;
  var lv = LEVELS[M.level];
  var elapsed = now - M.levelStart;

  if (M.phase === "warmup" && elapsed >= WARMUP_MS) {
    M.phase = "measure"; M.levelStart = now; elapsed = 0;
    M.frames = 0; M.times = []; M.drawCalls = 0; M.tris = 0;
    M.spikes = []; M.longTasks = []; M.nextSpike = now + SPIKE_EVERY_MS;
  }
  if (M.phase === "measure") {
    // Count every rendered frame, so per-frame geometry figures stay correct
    // even when a frame takes seconds. Only feed sane deltas to the timing
    // statistics, so one enormous outlier cannot distort the percentiles.
    M.frames++;
    if (dt > 0 && dt < 5000) M.times.push(dt);
    if (now >= M.nextSpike) { spike(); M.nextSpike = performance.now() + SPIKE_EVERY_MS; }
  }

  // Orbit, as a user inspecting the design would.
  var a = (now - started) / 1000 * 0.28;
  var eye = [Math.sin(a) * 13, 4.6 + Math.sin(a * 0.6) * 1.4, Math.cos(a) * 13];
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(U.uProj, false, perspective(0.95, canvas.width / canvas.height, 0.1, 120));
  gl.uniformMatrix4fv(U.uView, false, lookAt(eye, [0, 1.6, 0]));
  gl.uniform3f(U.uEye, eye[0], eye[1], eye[2]);
  gl.uniform1i(U.uTex, 0);
  gl.activeTexture(gl.TEXTURE0);

  gl.enableVertexAttribArray(A.pos);
  gl.enableVertexAttribArray(A.nrm);
  gl.enableVertexAttribArray(A.uv);
  var boundMesh = null;
  for (var i = 0; i < scene.length; i++) {
    var o = scene[i];
    if (o.mesh !== boundMesh) {
      boundMesh = o.mesh;
      gl.bindBuffer(gl.ARRAY_BUFFER, boundMesh.pos);
      gl.vertexAttribPointer(A.pos, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, boundMesh.nrm);
      gl.vertexAttribPointer(A.nrm, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, boundMesh.uv);
      gl.vertexAttribPointer(A.uv, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, boundMesh.idx);
    }
    gl.bindTexture(gl.TEXTURE_2D, o.tex);
    gl.uniformMatrix4fv(U.uModel, false, o.m);
    gl.uniform3f(U.uTint, o.tint[0], o.tint[1], o.tint[2]);
    gl.uniform1f(U.uRepeat, o.repeat);
    gl.drawElements(gl.TRIANGLES, o.mesh.count, gl.UNSIGNED_SHORT, 0);
    if (M.phase === "measure") { M.drawCalls++; M.tris += o.mesh.tris; }
  }

  var fps = M.times.length ? (1000 / (M.times.reduce(function(x,y){return x+y;},0) / M.times.length)) : 0;
  hud.textContent =
    "Level " + (M.level+1) + "/" + LEVELS.length + "  " + lv.name +
    "   " + (M.phase === "warmup" ? "warming up" : Math.max(0,(SECONDS_PER_LEVEL*1000-elapsed)/1000).toFixed(0)+"s") + "\n" +
    "FPS " + fps.toFixed(1) + "   frame " + (M.times.length?pctl(M.times,50).toFixed(1):0) +
    "ms  p95 " + (M.times.length?pctl(M.times,95).toFixed(1):0) + "ms\n" +
    scene.length + " draw calls   " +
    (scene.reduce(function(a,o){return a+o.mesh.tris;},0)/1e6).toFixed(2) + "M tris   " +
    canvas.width + "x" + canvas.height + "   " + lv.tex + "px textures\n" +
    "add-module stalls: " + M.spikes.length + (M.spikes.length ? "  worst " + Math.max.apply(null,M.spikes).toFixed(0) + "ms" : "");

  if (M.phase === "measure" && elapsed >= SECONDS_PER_LEVEL * 1000) {
    finishLevel();
    if (M.level + 1 < LEVELS.length) { startLevel(M.level + 1); }
    else { report(); return; }
  }
  requestAnimationFrame(frame);
}

function finishLevel() {
  var lv = LEVELS[M.level];
  var secs = (performance.now() - M.levelStart) / 1000;
  M.results.push({
    level: lv.name, modules: lv.modules, textures: lv.tex,
    draw_calls: scene.length,
    tris_per_frame: Math.round(M.tris / Math.max(1, M.frames)),
    canvas: canvas.width + "x" + canvas.height,
    pixels_m: +((canvas.width * canvas.height) / 1e6).toFixed(2),
    fps_mean: +(M.frames / secs).toFixed(1),
    frame_p50: +pctl(M.times, 50).toFixed(1),
    frame_p95: +pctl(M.times, 95).toFixed(1),
    frame_p99: +pctl(M.times, 99).toFixed(1),
    jank_pct: +(100 * M.times.filter(function(x){return x>33.34;}).length / Math.max(1,M.times.length)).toFixed(1),
    build_ms: +M.buildMs.toFixed(0),
    spikes: M.spikes.length,
    spike_ms_worst: M.spikes.length ? +Math.max.apply(null, M.spikes).toFixed(0) : 0,
    spike_ms_median: M.spikes.length ? +pctl(M.spikes, 50).toFixed(0) : 0,
    long_tasks: M.longTasks.length,
    long_ms_worst: M.longTasks.length ? +Math.max.apply(null, M.longTasks).toFixed(0) : 0,
    heap_mb: performance.memory ? +(performance.memory.usedJSHeapSize/1048576).toFixed(0) : null,
  });
}

/* -------------------------------------------------------------- report */
function report() {
  var R = M.results;
  var holds60 = null, holds30 = null;
  R.forEach(function (r) {
    if (r.fps_mean >= 58 && r.frame_p95 <= 22) holds60 = r.level;
    if (r.fps_mean >= 30) holds30 = r.level;
  });
  var top = R[R.length - 1];
  var findings = [];
  function add(l, t, d) { findings.push({ l: l, t: t, d: d }); }

  if (SOFTWARE) add("fail", "Not using the GPU",
    "Renderer reports as \"" + RENDERER + "\". Chrome is rendering in software, so every " +
    "number below reflects the CPU. Open chrome://gpu and enable hardware acceleration, " +
    "then run this again. Nothing else here is meaningful until that is fixed.");

  if (holds60) add("ok", "Holds 60 fps up to " + holds60,
    "At " + holds60 + " settings the machine sustains a full 60 fps with stable frame pacing.");
  else add(holds30 ? "warn" : "fail", "Never reached a stable 60 fps",
    "Even the Low preset did not hold 60 fps with consistent pacing.");

  if (holds30 && holds30 !== top.level)
    add("warn", "Falls below 30 fps above " + holds30,
      "Designs heavier than the " + holds30 + " preset (" +
      LEVELS[R.findIndex(function(r){return r.level===holds30;})].modules +
      " modules) will feel sluggish to orbit.");
  else if (holds30 === top.level)
    add("ok", "Comfortable at the heaviest preset",
      "Sustained " + top.fps_mean + " fps at " + top.modules + " modules and " +
      top.draw_calls + " draw calls.");

  var worstSpike = Math.max.apply(null, R.map(function(r){return r.spike_ms_worst;}));
  if (worstSpike > 400) add("fail", "Adding a module freezes the interface",
    "Worst synchronous stall " + worstSpike + " ms. In a real configurator this is the " +
    "pause after clicking a component. This is main-thread JavaScript - a faster GPU " +
    "does not help, and neither does a faster laptop by very much.");
  else if (worstSpike > 150) add("warn", "Noticeable pause when adding a module",
    "Worst synchronous stall " + worstSpike + " ms.");
  else add("ok", "Edits apply without a visible pause",
    "Worst synchronous stall " + worstSpike + " ms.");

  if (top.fps_mean < 1) {
    add("fail", "Heaviest preset did not render",
      "Ultra managed under 1 fps, so no meaningful timing could be collected at that level. " +
      "Treat " + (holds30 || "nothing below it") + " as this machine's practical ceiling.");
  } else {
    var scale = R[0].fps_mean / top.fps_mean;
    if (scale > 3) add("warn", "Performance falls away steeply with scene size",
      "Low is " + scale.toFixed(1) + "x faster than Ultra. This machine is sensitive to design " +
      "complexity: large projects will degrade fast.");
  }

  var order = { fail:0, warn:1, ok:2 };
  findings.sort(function(a,b){return order[a.l]-order[b.l];});
  var overall = findings.some(function(f){return f.l==="fail";}) ? "fail"
              : findings.some(function(f){return f.l==="warn";}) ? "warn" : "ok";
  var badge = { ok:["GOOD","#238636"], warn:["MARGINAL","#9e6a03"], fail:["POOR","#da3633"] }[overall];

  var html = "<h1>Interior configurator performance</h1>" +
    "<p><small>" + new Date().toString() + "<br>GPU: " + RENDERER +
    "<br>" + navigator.userAgent + "<br>Device pixel ratio " + (window.devicePixelRatio||1) +
    ", " + (navigator.hardwareConcurrency||"?") + " CPU threads</small></p>" +
    "<p><span class='v' style='background:" + badge[1] + "'>" + badge[0] + "</span></p>" +
    "<h2>Findings</h2>" +
    findings.map(function (f) {
      var c = { ok:"#238636", warn:"#9e6a03", fail:"#da3633" }[f.l];
      var n = { ok:"PASS", warn:"WARN", fail:"FAIL" }[f.l];
      return "<div class='f'><span class='tag' style='background:"+c+"'>"+n+"</span>" +
             "<span><b>"+f.t+"</b><br><small>"+f.d+"</small></span></div>";
    }).join("") +
    "<h2>Results by quality level</h2><table><tr><th>Level</th><th>Modules</th>" +
    "<th>Draw calls</th><th>Mean fps</th><th>p95 frame</th><th>Jank</th>" +
    "<th>Worst edit stall</th><th>Heap</th></tr>" +
    R.map(function (r) {
      return "<tr><td>"+r.level+"</td><td>"+r.modules+"</td><td>"+r.draw_calls+"</td><td>"+
        r.fps_mean+"</td><td>"+r.frame_p95+" ms</td><td>"+r.jank_pct+"%</td><td>"+
        r.spike_ms_worst+" ms</td><td>"+(r.heap_mb!=null?r.heap_mb+" MB":"n/a")+"</td></tr>";
    }).join("") + "</table>" +
    "<p><small>Each level ran for " + SECONDS_PER_LEVEL + "s after a warm-up, with an " +
    "\"add module\" edit every " + (SPIKE_EVERY_MS/1000) + "s. Render resolution: " +
    R.map(function(r){return r.level+" "+r.canvas;}).join(", ") + ".</small></p>" +
    "<p><button onclick='dl()'>Download report</button>" +
    "<button style='background:#30363d' onclick='location.reload()'>Run again</button></p>";

  var el = document.getElementById("done");
  el.querySelector(".in").innerHTML = html;
  el.style.display = "block";
  window.__result = { results: R, findings: findings, overall: overall,
                      renderer: RENDERER, software: SOFTWARE,
                      dpr: window.devicePixelRatio, ua: navigator.userAgent,
                      threads: navigator.hardwareConcurrency };
  window.dl = function () {
    var body = "<!doctype html><meta charset=utf-8><title>Configurator performance</title>" +
      "<style>body{font:14px/1.6 -apple-system,sans-serif;max-width:820px;margin:40px auto;padding:0 20px}" +
      "table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}" +
      ".v{display:inline-block;padding:5px 12px;border-radius:99px;color:#fff;font-weight:700}" +
      ".f{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee}" +
      ".tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;min-width:46px;text-align:center;height:fit-content}" +
      "small{color:#666}</style>" + html.replace(/<p><button[\s\S]*$/, "") +
      "<pre style='background:#f6f8fa;padding:12px;overflow:auto;font-size:11px'>" +
      JSON.stringify(window.__result, null, 1) + "</pre>";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], {type:"text/html"}));
    a.download = "configurator-performance-" + new Date().toISOString().slice(0,19).replace(/[:]/g,"-") + ".html";
    a.click();
  };
  // Machine-readable line for automated harnesses.
  console.log("LSRESULT " + JSON.stringify(window.__result));
}

window.addEventListener("resize", function(){ resize(LEVELS[M.level].res); });
startLevel(0);
requestAnimationFrame(frame);
</script>
